name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Packages
        run: pnpm --filter '@repo/*' build

      - name: Verify Formatting
        run: pnpm format:check

      - name: Run Linter
        run: pnpm lint

      - name: Run TypeScript Type Check
        run: pnpm typecheck

      - name: Setup PostgreSQL Test Database
        run: |
          sudo systemctl start postgresql.service
          pg_isready -h localhost -p 5432
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE USER $(whoami) SUPERUSER;" || true
          sudo sed -i 's/md5/trust/g' /etc/postgresql/*/main/pg_hba.conf || true
          sudo sed -i 's/scram-sha-256/trust/g' /etc/postgresql/*/main/pg_hba.conf || true
          sudo systemctl restart postgresql.service
          createdb marketplace_test || true
        env:
          PGPASSWORD: postgres

      - name: Run Automated Tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://localhost:5432/marketplace_test
          TEST_DATABASE_URL: postgresql://localhost:5432/marketplace_test

      - name: Build All Workspaces
        run: pnpm build
