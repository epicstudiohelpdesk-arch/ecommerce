openapi: 3.1.0
info:
  title: Handcrafted Multi-Vendor Marketplace API
  version: 1.0.0
  description: Canonical REST API contracts for the Handcrafted Multi-Vendor Marketplace platform.
servers:
  - url: /api/v1
    description: Current Environment Base Path

paths:
  /auth/register:
    post:
      summary: Register Customer Account
      operationId: registerCustomer
      tags: [Authentication & Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /auth/login:
    post:
      summary: Login with Credentials
      operationId: loginUser
      tags: [Authentication & Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /auth/logout:
    post:
      summary: Terminate Session
      operationId: logoutUser
      tags: [Authentication & Identity]
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Session terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/me:
    get:
      summary: Retrieve Authenticated User Profile & Roles
      operationId: getAuthMe
      tags: [Authentication & Identity]
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: User profile and permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/refresh:
    post:
      summary: Refresh Access Token with Token Rotation
      operationId: refreshToken
      tags: [Authentication & Identity]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Access token refreshed and refresh token rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/verify-email:
    post:
      summary: Verify Account Email Address
      operationId: verifyEmail
      tags: [Authentication & Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/forgot-password:
    post:
      summary: Request Account Password Reset
      operationId: forgotPassword
      tags: [Authentication & Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Generic confirmation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/reset-password:
    post:
      summary: Reset Account Password with Token
      operationId: resetPassword
      tags: [Authentication & Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset completed and sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/mfa/challenge:
    post:
      summary: Exchange MFA Challenge Ticket with TOTP Code
      operationId: mfaChallenge
      tags: [Authentication & Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaChallengeRequest'
      responses:
        '200':
          description: MFA challenge completed and tokens minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/mfa/setup:
    post:
      summary: Initialize Multi-Factor TOTP Setup
      operationId: setupMfa
      tags: [Authentication & Identity]
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Secret and otpauth URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/mfa/verify:
    post:
      summary: Confirm TOTP Setup and Enable MFA
      operationId: verifyMfa
      tags: [Authentication & Identity]
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: MFA enabled and backup codes generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/sessions:
    get:
      summary: List Active Sessions for Authenticated User
      operationId: getUserSessions
      tags: [Authentication & Identity]
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Active session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveSessionsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/sessions/revoke-all:
    post:
      summary: Revoke All Active Sessions for Authenticated User
      operationId: revokeAllSessions
      tags: [Authentication & Identity]
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: All sessions invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /seller/onboarding/status:
    get:
      summary: Retrieve Onboarding Status and Missing Checklist
      operationId: getSellerOnboardingStatus
      tags: [Seller Management]
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Current onboarding checklist and progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOnboardingStatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /seller/onboarding/draft:
    post:
      summary: Save or Update Onboarding Draft Information
      operationId: saveSellerDraft
      tags: [Seller Management]
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftSellerRequest'
      responses:
        '200':
          description: Draft updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOnboardingStatusResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /seller/onboarding/check-slug:
    get:
      summary: Verify Proposed Shop Slug Availability
      operationId: checkShopSlugAvailability
      tags: [Seller Management]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Slug availability confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugCheckResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /seller/onboarding/apply:
    post:
      summary: Submit Seller Onboarding Application
      operationId: applySeller
      tags: [Seller Management]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerApplicationRequest'
      responses:
        '200':
          description: Application submitted for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerApplicationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /seller/onboarding/documents:
    post:
      summary: Request Pre-signed Upload URL for Private KYC Document
      operationId: uploadKycDocument
      tags: [Seller Management]
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedDocumentRequest'
      responses:
        '201':
          description: Pre-signed upload ticket generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedDocumentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /seller/onboarding/documents/{documentId}/confirm:
    post:
      summary: Confirm Private Document Upload Completed
      operationId: confirmDocumentUpload
      tags: [Seller Management]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document upload confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /seller/onboarding/documents/{documentId}:
    delete:
      summary: Remove Draft Verification Document
      operationId: deleteDraftDocument
      tags: [Seller Management]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /seller/shop:
    get:
      summary: Retrieve Authenticated Seller Shop Details
      operationId: getSellerShop
      tags: [Seller Management]
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Seller shop details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerShopResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update Permitted Seller Shop Profile Details
      operationId: updateSellerShop
      tags: [Seller Management]
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShopProfileRequest'
      responses:
        '200':
          description: Updated seller shop details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerShopResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /seller/dashboard/overview:
    get:
      summary: Retrieve Seller Studio Business Dashboard Overview
      operationId: getSellerDashboardOverview
      tags: [Seller Management]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [today, 7d, 30d]
            default: 7d
      responses:
        '200':
          description: Seller business dashboard overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerDashboardResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /seller/analytics/performance:
    get:
      summary: Retrieve Seller Sales & Product Performance Analytics
      operationId: getSellerPerformanceAnalytics
      tags: [Seller Management]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
      responses:
        '200':
          description: Seller performance analytics report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerAnalyticsPerformanceResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /seller/notifications:
    get:
      summary: Retrieve Seller Actionable Notifications
      operationId: getSellerNotifications
      tags: [Seller Management]
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Seller notifications list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerNotificationsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /seller/eligibility:
    get:
      summary: Evaluate Seller Eligibility and Capabilities
      operationId: checkSellerEligibility
      tags: [Seller Management]
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Seller eligibility evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerEligibilityResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /catalog/categories:
    get:
      summary: Retrieve Active Categories Hierarchy
      operationId: listCategories
      tags: [Catalog]
      responses:
        '200':
          description: List of active handcrafted product categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesListResponse'

  /catalog/products:
    get:
      summary: Public Product Search & Discovery
      operationId: searchProducts
      tags: [Catalog]
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: productType
          in: query
          schema:
            type: string
            enum: [READY_TO_SHIP, MADE_TO_ORDER, ONE_OF_A_KIND, PERSONALIZED]
        - name: minPriceMinor
          in: query
          schema:
            type: integer
            minimum: 0
        - name: maxPriceMinor
          in: query
          schema:
            type: integer
            minimum: 0
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated catalog products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductsResponse'

  /catalog/products/{slug}:
    get:
      summary: Retrieve Product Details by Slug
      operationId: getProductBySlug
      tags: [Catalog]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed product information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /seller/products:
    get:
      summary: List Seller Products
      operationId: listSellerProducts
      tags: [Catalog]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING_REVIEW, APPROVED, PUBLISHED, REJECTED, ARCHIVED, SUSPENDED]
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Seller products list with inventory levels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSellerProductsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      summary: Create Product Draft
      operationId: createProductDraft
      tags: [Catalog]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductDraftRequest'
      responses:
        '201':
          description: Product draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductDraftResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /seller/products/media/ticket:
    post:
      summary: Request Pre-signed Media Upload Ticket
      operationId: generateMediaUploadTicket
      tags: [Catalog]
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedProductMediaTicketRequest'
      responses:
        '200':
          description: Signed upload ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedProductMediaTicketResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /seller/products/{id}:
    get:
      summary: Retrieve Seller Product Detail
      operationId: getSellerProduct
      tags: [Catalog]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Complete product detail for seller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      summary: Update Product Listing
      operationId: updateProduct
      tags: [Catalog]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /seller/products/{id}/submit:
    post:
      summary: Submit Listing for Compliance Review
      operationId: submitProductForModeration
      tags: [Catalog]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product successfully submitted for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /seller/products/{id}/archive:
    post:
      summary: Archive Product Listing
      operationId: archiveProduct
      tags: [Catalog]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product listing archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /seller/products/{id}/media:
    post:
      summary: Attach Uploaded Photo to Listing
      operationId: attachProductMedia
      tags: [Catalog]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachProductMediaRequest'
      responses:
        '201':
          description: Media attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachProductMediaResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /seller/products/{id}/media/{mediaId}:
    delete:
      summary: Remove Attached Media Asset
      operationId: removeProductMedia
      tags: [Catalog]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Media removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /seller/products/{id}/media/reorder:
    put:
      summary: Reorder Media Assets and Set Primary Photo
      operationId: reorderProductMedia
      tags: [Catalog]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [mediaId, displayOrder]
